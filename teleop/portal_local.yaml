# Local Docker / loopback Portal contract (same schema as portal.yaml).
# Pass with --portal-yaml portal_local.yaml. Secrets stay in .env.local;
# room name comes from LIVEKIT_ROOM. Tune fps/tolerance here without
# touching the production contract.
version: 1
fps: 30
slack: 2
tolerance: 1.5
state_reliable: false
action_reliable: false
reuse_stale_frames: false
ping_ms: 1000
videos:
  # Byte-stream (not WebRTC). LiveKit --dev drops H264 packet trailers, and
  # portal panics on missing user_timestamp — TeleVuer stays black.
  - { name: head_camera, codec: mjpeg, quality: 90 }
state:
  - { name: L_LEG_HIP_PITCH, dtype: f32 }
  - { name: L_LEG_HIP_ROLL, dtype: f32 }
  - { name: L_LEG_HIP_YAW, dtype: f32 }
