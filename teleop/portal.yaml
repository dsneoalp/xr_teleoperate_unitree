# Portal wire contract for Unitree G1-EDU (29 DoF body + Dex3 hands).
# Secrets stay in .env; room name comes from LIVEKIT_ROOM.
version: 1
fps: 30
slack: 10
tolerance: 4.0
state_reliable: true
action_reliable: true
reuse_stale_frames: false
ping_ms: 1000
videos:
  # First track is shown in TeleVuer. Name must match the robot publisher.
  - { name: head_camera, codec: h264, screencast: false, max_bitrate_kbps: 2000 }
state:
  # body ids 0–28, q in rad
  - { name: L_LEG_HIP_PITCH, dtype: f32 }
  - { name: L_LEG_HIP_ROLL, dtype: f32 }
  - { name: L_LEG_HIP_YAW, dtype: f32 }
  - { name: L_LEG_KNEE, dtype: f32 }
  - { name: L_LEG_ANKLE_PITCH, dtype: f32 }
  - { name: L_LEG_ANKLE_ROLL, dtype: f32 }
  - { name: R_LEG_HIP_PITCH, dtype: f32 }
  - { name: R_LEG_HIP_ROLL, dtype: f32 }
  - { name: R_LEG_HIP_YAW, dtype: f32 }
  - { name: R_LEG_KNEE, dtype: f32 }
  - { name: R_LEG_ANKLE_PITCH, dtype: f32 }
  - { name: R_LEG_ANKLE_ROLL, dtype: f32 }
  - { name: WAIST_YAW, dtype: f32 }
  - { name: WAIST_ROLL, dtype: f32 }
  - { name: WAIST_PITCH, dtype: f32 }
  - { name: L_SHOULDER_PITCH, dtype: f32 }
  - { name: L_SHOULDER_ROLL, dtype: f32 }
  - { name: L_SHOULDER_YAW, dtype: f32 }
  - { name: L_ELBOW, dtype: f32 }
  - { name: L_WRIST_ROLL, dtype: f32 }
  - { name: L_WRIST_PITCH, dtype: f32 }
  - { name: L_WRIST_YAW, dtype: f32 }
  - { name: R_SHOULDER_PITCH, dtype: f32 }
  - { name: R_SHOULDER_ROLL, dtype: f32 }
  - { name: R_SHOULDER_YAW, dtype: f32 }
  - { name: R_ELBOW, dtype: f32 }
  - { name: R_WRIST_ROLL, dtype: f32 }
  - { name: R_WRIST_PITCH, dtype: f32 }
  - { name: R_WRIST_YAW, dtype: f32 }
  # Dex3, 7 DoF per hand
  - { name: left_thumb_mcp, dtype: f32 }
  - { name: left_thumb_aux, dtype: f32 }
  - { name: left_thumb_pip, dtype: f32 }
  - { name: left_index_mcp, dtype: f32 }
  - { name: left_index_pip, dtype: f32 }
  - { name: left_middle_mcp, dtype: f32 }
  - { name: left_middle_pip, dtype: f32 }
  - { name: right_thumb_mcp, dtype: f32 }
  - { name: right_thumb_aux, dtype: f32 }
  - { name: right_thumb_pip, dtype: f32 }
  - { name: right_index_mcp, dtype: f32 }
  - { name: right_index_pip, dtype: f32 }
  - { name: right_middle_mcp, dtype: f32 }
  - { name: right_middle_pip, dtype: f32 }
  - { name: fsm_id, dtype: i32 }
action:
  # Gateway-Teleop / FSM; in v1 nur empfangen, nicht ausführen
  - { name: fsm_id, dtype: i32 }
  - { name: vx, dtype: f32 }
  - { name: vy, dtype: f32 }
  - { name: vyaw, dtype: f32 }
  - { name: L_SHOULDER_PITCH, dtype: f32 }
  - { name: L_SHOULDER_ROLL, dtype: f32 }
  - { name: L_SHOULDER_YAW, dtype: f32 }
  - { name: L_ELBOW, dtype: f32 }
  - { name: L_WRIST_ROLL, dtype: f32 }
  - { name: L_WRIST_PITCH, dtype: f32 }
  - { name: L_WRIST_YAW, dtype: f32 }
  - { name: R_SHOULDER_PITCH, dtype: f32 }
  - { name: R_SHOULDER_ROLL, dtype: f32 }
  - { name: R_SHOULDER_YAW, dtype: f32 }
  - { name: R_ELBOW, dtype: f32 }
  - { name: R_WRIST_ROLL, dtype: f32 }
  - { name: R_WRIST_PITCH, dtype: f32 }
  - { name: R_WRIST_YAW, dtype: f32 }
  - { name: left_thumb_mcp, dtype: f32 }
  - { name: left_thumb_aux, dtype: f32 }
  - { name: left_thumb_pip, dtype: f32 }
  - { name: left_index_mcp, dtype: f32 }
  - { name: left_index_pip, dtype: f32 }
  - { name: left_middle_mcp, dtype: f32 }
  - { name: left_middle_pip, dtype: f32 }
  - { name: right_thumb_mcp, dtype: f32 }
  - { name: right_thumb_aux, dtype: f32 }
  - { name: right_thumb_pip, dtype: f32 }
  - { name: right_index_mcp, dtype: f32 }
  - { name: right_index_pip, dtype: f32 }
  - { name: right_middle_mcp, dtype: f32 }
  - { name: right_middle_pip, dtype: f32 }
