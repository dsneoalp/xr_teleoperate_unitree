# 2x2 like SAG video-ingress (row-major, fill, empty cell black),
# scaled to 1280x720. 1080p RGB blit is ~62 ms on this FFI (~14 Hz);
# 720p is the pixel budget that hits ~28 Hz send.
canvas:
  width: 1280
  height: 720
tiles:
  - { slot: head_camera, x: 0, y: 0, w: 640, h: 360, fit: fill }
  - { slot: left_wrist_camera, x: 640, y: 0, w: 640, h: 360, fit: fill }
  - { slot: right_wrist_camera, x: 0, y: 360, w: 640, h: 360, fit: fill }
