# Operator on the server, robot/mock on host network so LIVEKIT_URL=ws://127.0.0.1:7880 works.
# From repo root:
#   docker compose -f docker/compose.yml build mock operator robot
#   docker compose -f docker/compose.yml up mock
#   docker compose -f docker/compose.yml run --rm -it operator
#
# teleop/ is bind-mounted so host edits apply on container restart (no rebuild).
# New pip deps or Dockerfile changes still need: docker compose -f docker/compose.yml build

name: xr-teleop

x-portal-build: &portal-build
  context: ..
  dockerfile: docker/Dockerfile

services:
  mock:
    build:
      <<: *portal-build
      target: mock
    image: xr-teleop:mock
    network_mode: host
    env_file:
      - ../teleop/.env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../teleop:/app/teleop
    stdin_open: true
    tty: true
    restart: "no"

  robot:
    build:
      <<: *portal-build
      target: robot
    image: xr-teleop:robot
    network_mode: host
    env_file:
      - ../teleop/.env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../teleop:/app/teleop
    stdin_open: true
    tty: true
    restart: "no"

  operator:
    build:
      <<: *portal-build
      target: operator
    image: xr-teleop:operator
    network_mode: host
    env_file:
      - ../teleop/.env
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../teleop:/app/teleop
      - ../assets:/app/assets
      - ../docker/entrypoint-operator.sh:/entrypoint-operator.sh:ro
      - operator-certs:/certs
    shm_size: "256mb"
    stdin_open: true
    tty: true
    restart: "no"

volumes:
  operator-certs:
